listener 1883
protocol mqtt
cafile /run/bike-certs/ca.crt
certfile /run/bike-certs/server.crt
keyfile /run/bike-private/server.key
allow_anonymous false
password_file /run/bike-private/passwords
acl_file /run/bike-private/acl
persistence true
persistence_location /mosquitto/data/
# Keep queued QoS 1 events until the persistent processor session can store them.
max_queued_messages 0
max_queued_bytes 0
log_dest stdout
